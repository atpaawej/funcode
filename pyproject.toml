[project]
name = "funcode"
version = "0.1.0"
description = "funcode - personal extensible agent (v0 raw loop)"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "prompt-toolkit>=3.0.53",
  "rich>=13.0.0",
]

[project.scripts]
funcode = "funcode.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funcode"]

[tool.uv]
package = true
